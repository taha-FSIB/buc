name = "buc-alumni-portal"
main = "src/index.tsx"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Off deliberately. Preview URLs publish every deployed version at its own
# public address, which for a private members' site means several live origins
# nobody is watching — and sign-in links are pinned to SITE_URL, so a member
# who landed on one would be bounced between hostnames. Stated explicitly so
# it is a decision rather than whatever the default happens to be.
preview_urls = false

# Static assets (CSS, icons, fonts) are served straight from the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Relational data: members, groups, posts, share grants, moderation queue.
[[d1_databases]]
binding = "DB"
database_name = "buc_alumni"
# Created in APAC deliberately. D1 has no read replicas on the free plan, so
# every query is a round trip to this one region — and most of this batch is in
# Sri Lanka. Western Europe was the default and cost roughly 100ms a query.
database_id = "8b19ef09-99b2-4eac-a1c1-a51d045b8953"
migrations_dir = "migrations"

# Object storage: photos, audio, video, souvenir PDFs.
#
# COMMENTED OUT, NOT DELETED. R2 must be switched on in the Cloudflare
# dashboard before the API will create a bucket, and a Worker cannot deploy
# with a binding to a bucket that does not exist — the whole deploy fails, not
# just the media parts.
#
# To turn it back on:
#   1. dash.cloudflare.com -> R2 -> enable (this is the payment-method step)
#   2. npx wrangler r2 bucket create buc-alumni-media --location apac
#   3. uncomment the three lines below
#   4. npm run deploy
#
# The code handles both states: `MEDIA` is optional in types.ts and everything
# touching it goes through `mediaEnabled()`, which also hides the upload forms
# rather than offering something that cannot be saved.
#
# Note this DOES take R2 away from local development as well — wrangler reads
# one config for both, so `wrangler dev --local` stops simulating the bucket
# and check-visibility.mjs loses its media assertions until step 3 above. An
# earlier version of this comment claimed otherwise; it was checked and it was
# wrong.
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "buc-alumni-media"

[vars]
SITE_NAME = "BUC Alumni"

# Absolute origin used to build sign-in links. Blank falls back to the
# request's own origin, which means a forged Host header could send a real
# member a real sign-in token pointing at somebody else's site. Now that there
# is a deployment, it is pinned. Change this the day a custom domain is added.
SITE_URL = "https://buc-alumni-portal.buc-alumni-portal.workers.dev"

# From address for sign-in and invitation emails, e.g.
#   MAIL_FROM = "BUC Alumni <hello@bucpioneers.org>"
# Leave blank and nothing is emailed: admins copy links out of /admin/members
# and send them on WhatsApp instead. That is a supported way to run this.
MAIL_FROM = ""

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   RESEND_API_KEY  - email provider key; without it, no email is sent
#
# There is deliberately no SESSION_SECRET. Sessions are not signed cookies:
# a token is 256 bits from crypto.getRandomValues, and only its SHA-256 digest
# is stored, so the token itself is the secret and a leaked database yields
# hashes rather than usable sessions. This file used to ask for an HMAC key
# that no line of code ever read — a secret that protects nothing is worse
# than no secret, because somebody sets it and believes they are covered.
