name = "buc-alumni-portal"
main = "src/index.tsx"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Static assets (CSS, icons, fonts) are served straight from the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Relational data: members, groups, posts, share grants, moderation queue.
[[d1_databases]]
binding = "DB"
database_name = "buc_alumni"
# Created in APAC deliberately. D1 has no read replicas on the free plan, so
# every query is a round trip to this one region — and most of this batch is in
# Sri Lanka. Western Europe was the default and cost roughly 100ms a query.
database_id = "8b19ef09-99b2-4eac-a1c1-a51d045b8953"
migrations_dir = "migrations"

# Object storage: photos, audio, video, souvenir PDFs.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "buc-alumni-media"

[vars]
SITE_NAME = "BUC Alumni"

# Absolute origin used to build sign-in links. Leave blank in development (the
# request's own origin is used) but SET IT BEFORE GOING LIVE: without it, a
# forged Host header could send a member a real token pointing somewhere else.
SITE_URL = ""

# From address for sign-in and invitation emails, e.g.
#   MAIL_FROM = "BUC Alumni <hello@bucpioneers.org>"
# Leave blank and nothing is emailed: admins copy links out of /admin/members
# and send them on WhatsApp instead. That is a supported way to run this.
MAIL_FROM = ""

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   RESEND_API_KEY  - email provider key; without it, no email is sent
#
# There is deliberately no SESSION_SECRET. Sessions are not signed cookies:
# a token is 256 bits from crypto.getRandomValues, and only its SHA-256 digest
# is stored, so the token itself is the secret and a leaked database yields
# hashes rather than usable sessions. This file used to ask for an HMAC key
# that no line of code ever read — a secret that protects nothing is worse
# than no secret, because somebody sets it and believes they are covered.
